services:
  - type: web
    name: swapastro-api
    runtime: python
    plan: free
    rootDir: backend
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: CORS_ORIGINS
        sync: false
      - key: EPHEMERIS_PATH
        sync: false
